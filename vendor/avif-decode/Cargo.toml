# Vendored from avif-decode 3.0.0 (https://github.com/kornelski/avif-decode), unchanged apart from
# this manifest: upstream enables rav1d's x86 assembly, which needs the nasm assembler installed
# to build. Here rav1d is pure Rust on every architecture.
[package]
name = "avif-decode"
version = "3.0.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
avif-parse = "2.1.0"
bytemuck = "1.25"
imgref = "1.12.3"
log = "0.4.34"
quick-error = "2.0.1"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"] }
yuv = "0.8.19"
