on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: cargo build --release
      - uses: softprops/action-gh-release@v3.0.0
        with:
          files: target/release/imgoptim
