[package]
name = "imgoptim"
version = "0.1.2"
edition = "2024"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
fast_image_resize = { version = "6.0.0", features = ["rayon"] }
image = { version = "0.25.9", default-features = false, features = ["avif", "rayon"] }
zune-core = "0.5.1"
zune-jpeg = "0.5.12"
zune-png = "0.5.1"
