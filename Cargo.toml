[package]
name = "imgoptim"
version = "0.1.0"
edition = "2024"

[dependencies]
argp = "0.4.1"
libc = "0.2.191"
mozjpeg-sys = "2"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel", "zopfli"] }
oxvg_ast = { version = "0.0.9", features = ["roxmltree"] }
oxvg_optimiser = "0.0.9"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
mozjpeg = "0.10"
