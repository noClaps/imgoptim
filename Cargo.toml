[package]
name = "imgoptim"
version = "0.1.0"
edition = "2024"

[dependencies]
argp = "0.4.1"
base64 = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.191"
mozjpeg-sys = "2"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel", "zopfli"] }
oxvg_ast = { version = "0.0.9", features = ["roxmltree"] }
oxvg_optimiser = "0.0.9"
resvg = "0.49.0"
roxmltree = "0.21"
