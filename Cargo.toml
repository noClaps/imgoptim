[package]
name = "imgoptim"
version = "0.1.0"
edition = "2024"

[dependencies]
argp = "0.4.1"
avif-decode = { path = "vendor/avif-decode" }
base64 = "0.23"
heifer = { version = "0.3.15", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.191"
mozjpeg-sys = "2"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel", "zopfli"] }
oxvg_ast = { version = "0.0.9", features = ["roxmltree"] }
oxvg_optimiser = "0.0.9"
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
resvg = "0.49.0"
roxmltree = "0.21"

# rav1e's x86 assembly needs the nasm assembler installed, but its ARM assembly builds with the
# usual C toolchain, so it's only enabled there.
[target.'cfg(target_arch = "aarch64")'.dependencies]
ravif = { version = "0.13.0", default-features = false, features = ["asm", "threading"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
